<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big 12 Attendance Tracker</title>
  <link rel="icon" href="assets/logos/big12.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="site/styles.css" />
</head>
<body>
  <header>
    <h1><img src="assets/logos/big12.svg" alt="Big 12" class="brand" />Attendance Tracker</h1>
    <div class="controls">
      <label for="season">Season</label>
      <select id="season"></select>
    </div>
  </header>

  <section id="summary" class="cards"></section>

  <main>
    <div class="table-wrap">
      <table id="attendance-table"></table>
    </div>
    <p id="empty-note" class="note" hidden></p>
    <section id="charts"></section>
  </main>

  <footer>
    <p id="source-note" class="note"></p>
    <p class="note">Part of <a href="https://big12ology.com/">Big12ology</a> ·
    <a href="https://big12ology.com/privacy">Privacy</a></p>
  </footer>

  <script type="module" src="site/app.js"></script>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "355e765d921e4b36ad2bf78d509eae6c"}'></script>

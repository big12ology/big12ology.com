name = "b12-pickem"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = false

# THE ROUTE IS THE BLAST RADIUS. Read this before changing it.
#
# big12ology.com is a static site on GitHub Pages, served through Cloudflare's
# proxy. The apex A records point at 185.199.x and are orange-clouded, so every
# request already transits the edge; this route is evaluated before the origin
# fetch, which is what lets /api/* be handled here while everything else falls
# through to Pages untouched. No DNS change was needed and none should be made.
#
# Two ways to take the entire domain down from this file:
#
#   * a route of "big12ology.com/*" — the Worker would answer for every page on
#     the site, including the ones it knows nothing about.
#   * a Workers Custom Domain on the apex — that REPLACES the A records, and
#     the static site stops existing.
#
# The deploy workflow asserts this string before it runs. Bare /api is listed
# separately because it does not match /api/* and would otherwise reach Pages
# and 404 as HTML.
routes = [
  { pattern = "big12ology.com/api/*", zone_name = "big12ology.com" },
  { pattern = "big12ology.com/api",   zone_name = "big12ology.com" },
]

# Public identifiers, not credentials. The client SECRETS live in
# `wrangler secret put` and never in this file — see worker/README.md.
[vars]
SITE_ORIGIN = "https://big12ology.com"
# The Pages origin, fetched directly for slates and scores: no Cloudflare cache
# in the way, and no subrequest looping back through our own route. The same
# trick cert-watch.yml and compare-live.sh already use.
PAGES_ORIGIN = "https://big12ology.github.io"
# Enter the survivor pool by this week to be on its leaderboard. Entry itself
# never closes; this only decides who is in the running for the season, and it
# exists because almost every run is dead by December — without it, one person
# joining in the last week and winning once could be the only survivor and take
# the title on a single pick. tiebreaker/build.py states this number on the
# rules page and must be changed with it.
SURVIVOR_RANKED_ENTRY_BY = "6"
GOOGLE_CLIENT_ID = "1029553052112-5db59l7pljf20ovi2913lghhv7n9rvgm.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23lioQoMOhhs5h5Cs7"

[[d1_databases]]
binding = "DB"
database_name = "b12_pickem"
database_id = "3fe46d0d-f188-4e11-9f4f-359c5a5b1efb"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c26df5e7e0904d1db35a4b2131b51a05"

# Times are UTC, and chosen to mirror pages.yml's game windows so a final is
# picked up within about an hour of being posted.
[triggers]
# CLOUDFLARE NUMBERS THE WEEK FROM 1 = SUNDAY TO 7 = SATURDAY.
#
# Not 0 = Sunday. It follows Quartz, and every one of these was first written
# in ordinary cron, which made all three wrong in the same direction: the
# Tuesday import ran on Monday, before pages.yml had published the slate it
# was importing, and the weekend sweep ran on Friday.
#
# Only the first was caught, and only because it contained a 0, which is out
# of Cloudflare's range and failed the deploy outright. The other two were
# valid syntax with the wrong meaning and would have shipped silently — the
# whole season running a day early, with nothing to say so.
#
# The times are UTC. A US Saturday runs from Saturday noon UTC into Sunday
# morning UTC, which is why the sweep covers both days.
# THE SWEEPS RUN AT :30, AND THE HALF HOUR IS THE POINT. This Worker holds no
# CFBD key and never will, so it does not learn a result from the provider —
# it grades from tiebreaker/pickem-scores.json, which pages.yml publishes on
# its own hourly cron at :00. Both were set to :00, which meant the sweep
# almost always read the file the publisher had written an HOUR earlier: a
# game final at 20:05 was published at 21:00 and graded at 22:00, so a board
# could sit two hours behind a result that was on every television.
#
# Half an hour after the publisher costs nothing — no extra CFBD call, no
# extra Worker invocation — and turns that two hours into one. Anything
# faster is not a scheduling problem: it means publishing scores more often,
# and every extra pages.yml run spends a call against a 1,000-a-month cap.
#
# If pages.yml's hourly crons ever move off :00, move these with them.
crons = [
  "30 * * 8-12 1,7",       # hourly Sat + Sun UTC — the score sweep
  "30 0-8/2 * 8-12 2,6,7", # Mon/Fri/Sat UTC, small hours: Sun/Thu/Fri
                           # night finals in the US
  "0 13 * 8-12 3",         # Tue UTC — import the week's slate, an hour after
                           # pages.yml's 12:00 refresh has published it
  # ALL YEAR, unlike the three above. This one exists for the heartbeat: the
  # cron pings a dead man's switch when it finishes, and a switch that stops
  # being pinged every January would page somebody daily for seven months —
  # so it would get muted, and a muted alarm is not an alarm.
  #
  # Out of season it costs two fetches: week 0 and week 1 both 404 because
  # nothing is published, the walk gives up, and there are no locked weeks to
  # score. It also means a January breakage is found in January rather than
  # discovered in August.
  "0 12 * * *",            # daily noon UTC — the heartbeat
]

[observability]
enabled = true

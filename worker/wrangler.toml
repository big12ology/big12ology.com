name = "b12-pickem"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = false

# THE ROUTE IS THE BLAST RADIUS. Read this before changing it.
#
# big12ology.com is a static site on GitHub Pages, served through Cloudflare's
# proxy. The apex A records point at 185.199.x and are orange-clouded, so every
# request already transits the edge; this route is evaluated before the origin
# fetch, which is what lets /api/* be handled here while everything else falls
# through to Pages untouched. No DNS change was needed and none should be made.
#
# Two ways to take the entire domain down from this file:
#
#   * a route of "big12ology.com/*" — the Worker would answer for every page on
#     the site, including the ones it knows nothing about.
#   * a Workers Custom Domain on the apex — that REPLACES the A records, and
#     the static site stops existing.
#
# The deploy workflow asserts this string before it runs. Bare /api is listed
# separately because it does not match /api/* and would otherwise reach Pages
# and 404 as HTML.
routes = [
  { pattern = "big12ology.com/api/*", zone_name = "big12ology.com" },
  { pattern = "big12ology.com/api",   zone_name = "big12ology.com" },
]

# Public identifiers, not credentials. The client SECRETS live in
# `wrangler secret put` and never in this file — see worker/README.md.
[vars]
SITE_ORIGIN = "https://big12ology.com"
# The Pages origin, fetched directly for slates and scores: no Cloudflare cache
# in the way, and no subrequest looping back through our own route. The same
# trick cert-watch.yml and compare-live.sh already use.
PAGES_ORIGIN = "https://big12ology.github.io"
# Enter the survivor pool by this week to be on its leaderboard. Entry itself
# never closes; this only decides who is in the running for the season, and it
# exists because almost every run is dead by December — without it, one person
# joining in the last week and winning once could be the only survivor and take
# the title on a single pick. tiebreaker/build.py states this number on the
# rules page and must be changed with it.
SURVIVOR_RANKED_ENTRY_BY = "6"
GOOGLE_CLIENT_ID = "1029553052112-5db59l7pljf20ovi2913lghhv7n9rvgm.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23lioQoMOhhs5h5Cs7"
# MICROSOFT AND AMAZON ARE WIRED AND DARK.
#
# src/oauth.js knows how to talk to both. `enabled(env)` offers a provider only
# when its credentials are actually present, so an unconfigured one is a 404 at
# /api/auth/login/<name> and its button is removed from the account page by
# /api/auth/providers. Neither of these is a placeholder to be filled in "when
# it works" — both code paths are tested and the secrets are the whole
# remaining step.
#
# To turn one on, add its CLIENT_ID here and put the secret in with
# `wrangler secret put`. No deploy is required for the button to appear.
#
#   MICROSOFT_CLIENT_ID = "..."     Entra app registration, "Personal Microsoft
#                                   accounts only". Redirect URI:
#                                   https://big12ology.com/api/auth/callback/microsoft
#                                   secret: MICROSOFT_CLIENT_SECRET
#
#   AMAZON_CLIENT_ID = "amzn1.application-oa2-client...."
#                                   Login with Amazon, Allowed Return URL:
#                                   https://big12ology.com/api/auth/callback/amazon
#                                   secret: AMAZON_CLIENT_SECRET
#
# NOT APPLE, and deliberately not. Sign in with Apple needs a paid developer
# account, and the enrolment forces a choice this project has no good answer
# to: an Individual account publishes a legal name, and an Organization one
# needs a D-U-N-S registered to a real entity — Apple accepts no trade names.
# The recurring fee bought a per-request ES256 client-secret JWT to maintain
# and an identity decision nobody wanted. Adding it later is a row in REGISTRY
# and a button; there is nothing else to undo.
GITHUB_REPO = "big12ology/big12ology.com"
DEPLOY_CRONS = "30 * * 8-12 1,7|30 0-8/2 * 8-12 2,6,7"

[[d1_databases]]
binding = "DB"
database_name = "b12_pickem"
database_id = "3fe46d0d-f188-4e11-9f4f-359c5a5b1efb"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c26df5e7e0904d1db35a4b2131b51a05"

# Where the publisher's scores land. Written by /api/ingest/scores, read by the
# scoring sweep — see src/scoring.js's fetchScores for why there are two
# channels and which one wins.
#
# ITS OWN NAMESPACE, not a key prefix inside SESSIONS. Those two have nothing
# in common but the word "KV": sessions are per-person, revocable, and the
# hottest reads on the site; this is one key per season, written a few times an
# hour by one caller. Sharing would mean a namespace that cannot be cleared
# without signing everybody out, and a blast radius that spans both.
#
# NOT BACKED UP, and it does not need to be. backup.yml exists for the one
# thing that cannot be rebuilt — accounts and picks. Scores are derived: the
# publisher regenerates this file from committed data on its next run, and
# until it does, fetchScores falls back to the Pages copy.
#
# Created 2026-08-12 with `wrangler kv namespace create SCORES`. worker.yml
# refuses to deploy while a binding still carries a PLACEHOLDER_ id, because a
# deploy that silently lost this binding would fall back to Pages and look
# exactly like everything working.
[[kv_namespaces]]
binding = "SCORES"
id = "062b6400bca24a0a99dec72d2010dea5"

# Where /api/e writes. No id to create and nothing to provision: naming a
# dataset here is what brings it into existence, and it is queried by name
# over the SQL API — see tools/events-report.sh.
#
# NOT D1, and the reason is the write pattern rather than a preference. Every
# interesting event on this site happens dozens of times per reader per visit,
# and a row per event in a relational database is a table that has to be
# indexed, pruned and paid for, on a Worker whose entire job elsewhere is to
# avoid writes. Analytics Engine is write-only, sampled, aggregated at query
# time and expires on its own after ninety days, which is the correct set of
# properties for a counter and the wrong one for a pick.
#
# It also cannot be joined to anything. That is a feature here: the privacy
# page promises there is no identifier to join on, and a store with no primary
# key makes the promise structural rather than something to remember.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "b12_events"

# Times are UTC, and chosen to mirror pages.yml's game windows so a final is
# picked up within about an hour of being posted.
[triggers]
# CLOUDFLARE NUMBERS THE WEEK FROM 1 = SUNDAY TO 7 = SATURDAY.
#
# Not 0 = Sunday. It follows Quartz, and every one of these was first written
# in ordinary cron, which made all three wrong in the same direction: the
# Tuesday import ran on Monday, before pages.yml had published the slate it
# was importing, and the weekend sweep ran on Friday.
#
# Only the first was caught, and only because it contained a 0, which is out
# of Cloudflare's range and failed the deploy outright. The other two were
# valid syntax with the wrong meaning and would have shipped silently — the
# whole season running a day early, with nothing to say so.
#
# The times are UTC. A US Saturday runs from Saturday noon UTC into Sunday
# morning UTC, which is why the sweep covers both days.
# THE SWEEPS ARE A BACKSTOP NOW, NOT THE PATH.
#
# They used to be how a final reached a board, and the :30 offset was load
# bearing: this Worker holds no CFBD key, so it graded from a file pages.yml
# published at :00, and running the sweep at :00 too meant usually reading the
# copy written an hour earlier. A game final at 20:05 was published at 21:00
# and graded at 22:00 — two hours behind a result that was on every
# television. Half an hour after the publisher turned that into one.
#
# scores.yml now POSTs to /api/ingest/scores, which verifies, stores and
# grades in the same request. A final is on the board within seconds of the
# publisher learning it, and no cron is involved in the ordinary case.
#
# So what is left for these to do:
#
#   * import slates, which still arrive as files on the Pages origin and are
#     still walked by the cron. That is the Tuesday trigger below, and the
#     reason the weekend sweeps have not simply been deleted.
#   * grade anything the ingest missed — a run that failed, a signature that
#     was refused, a week that locked with nobody publishing.
#   * carry the heartbeat.
#
# The :30 is kept because it costs nothing and the ordering argument above is
# still true of the fallback path. It is no longer what decides how fast a
# board moves, so it no longer has to be kept in step with pages.yml.
crons = [
  "30 * * 8-12 1,7",       # hourly Sat + Sun UTC — the score sweep
  "30 0-8/2 * 8-12 2,6,7", # Mon/Fri/Sat UTC, small hours: Sun/Thu/Fri
                           # night finals in the US
  "0 13 * 8-12 3",         # Tue UTC — import the week's slate, an hour after
                           # pages.yml's 12:00 refresh has published it
  # ALL YEAR, unlike the three above. This one exists for the heartbeat: the
  # cron pings a dead man's switch when it finishes, and a switch that stops
  # being pinged every January would page somebody daily for seven months —
  # so it would get muted, and a muted alarm is not an alarm.
  #
  # Out of season it costs two fetches: week 0 and week 1 both 404 because
  # nothing is published, the walk gives up, and there are no locked weeks to
  # score. It also means a January breakage is found in January rather than
  # discovered in August.
  "0 12 * * *",            # daily noon UTC — the heartbeat
]

[observability]
enabled = true

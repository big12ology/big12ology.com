name: Update attendance data

# Fetches attendance, rebuilds the snapshots, and commits under attendance/.
# It does not deploy: it asks the Pages workflow to run when the data
# actually changed. That dispatch is deliberate — a push made with
# GITHUB_TOKEN does not trigger other workflows, so the push trigger on
# pages.yml would never see this commit.

on:
  schedule:
    # All times below are Arizona (MST, UTC-7, no DST); season months only
    # (late Aug – mid Dec). Every run commits only if data changed; the
    # ESPN-direct fallback catches anything CFBD hasn't ingested yet.
    # Saturday 3pm — early kickoffs are final, afternoon games in progress.
    - cron: "0 22 * 8-12 6"
    # Saturday 7pm — most afternoon/early-evening games final.
    - cron: "0 2 * 8-12 0"
    # Saturday overnight (11:30pm) — late Mountain/Pacific kickoffs final.
    - cron: "30 6 * 8-12 0"
    # Sunday morning 7am — the traditional full sweep.
    - cron: "0 14 * 8-12 0"
    # Sunday night 7pm — follow-up for late-reporting games and corrections.
    - cron: "0 2 * 8-12 1"
    # Friday and Saturday mornings 7am — Thursday/Friday night games.
    - cron: "0 14 * 8-12 5,6"
    # Monday morning 7am — Sunday games (weeks 1-2 have Sunday slates).
    - cron: "0 14 * 8-12 1"
  workflow_dispatch:
    inputs:
      year:
        description: "Season year"
        default: "2026"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance
    permissions:
      contents: write
      actions: write   # to dispatch the Pages workflow below
    steps:
      - uses: actions/checkout@v7

      - name: Fetch attendance from CFBD
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 scripts/fetch_attendance.py "${{ inputs.year || '2026' }}"

      - name: Rebuild snapshots
        run: node scripts/build_snapshots.mjs "${{ inputs.year || '2026' }}"

      # The flat CSV is what non-JS consumers read. It has to be rebuilt
      # whenever the data moves, or it silently becomes a different dataset
      # from the one the page shows.
      - name: Rebuild the flat CSV
        run: node scripts/build_csv.mjs

      # The Python half covers the fetch's CFBD-less path, which by
      # definition never runs on a healthy day — so nothing else here would
      # notice it breaking until the outage it exists for. Fully stubbed: it
      # calls neither ESPN nor CFBD, and spends nothing from the quota.
      - name: Run tests (parity + chart render smoke + fetch fallback)
        run: |
          node --test tests/parity.test.mjs tests/render.test.mjs
          python3 -m unittest discover -s tests

      - name: Cross-check attendance vs ESPN
        id: verify
        continue-on-error: true
        run: python3 scripts/verify_attendance.py "${{ inputs.year || '2026' }}"

      # BEFORE THE COMMIT, not after it. This gate used to sit at the end of
      # the job, which meant a run could fail the cross-check and still have
      # pushed the data it was failing about. On 2026-09-06 it did exactly
      # that: "Attendance update: 2026-09-06" landed with a null crowd for a
      # game that had been played, the run then went red, and the bad row sat
      # on main for five hours until the next run happened to fix it. Red after
      # the fact is not a gate, it is a receipt.
      #
      # The cost of the order is one CFBD call. A blocked run discards what it
      # fetched, and the next one asks again — the fetch spends exactly one
      # /games call (the venue catalog is committed and only fetched when
      # missing), against a thousand a month. Cheap enough that shipping data
      # the check just objected to was never the better trade.
      #
      # Nothing downstream is lost by stopping here. verify_attendance.py's
      # memory of the previous run is the committed verification file, and the
      # status that depends on it (espn_ahead, a first sighting) exits clean and
      # therefore still commits. Only a run that already decided something is
      # wrong stops before writing.
      #
      # Read the cross-check's own output for what went wrong. This step used
      # to assert "mismatch" for any non-zero exit, and in September 2026 it
      # reported an ESPN 403 that had crashed the verifier as a disagreement
      # between two sources, only one of which had been reached.
      #
      # It then made the same mistake once more, in the other direction. On
      # 2026-09-06 a Kansas State crowd ESPN published between the fetch and
      # the check came out as a MISMATCH, and this message sent whoever read it
      # after a school box score to arbitrate a disagreement that did not
      # exist: there was one number in it, not two. Naming the cases is the fix
      # — a message that says "anything else is the check failing to run" is
      # wrong the moment a third thing can go wrong.
      - name: Fail run if the cross-check did not pass
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Cross-check did not pass, so nothing was committed. The reason is in the 'Cross-check attendance vs ESPN' step above, and it is one of three things:"
          echo "  MISMATCH   — two numbers that differ. The sources genuinely disagree and an official school box score is the arbiter."
          echo "  stuck      — ESPN has a crowd we still do not, two runs running. Nobody disagrees; the fetch's ESPN fill is not working. Start there, not at a box score."
          echo "  neither    — the check itself could not run, e.g. ESPN unreachable for every game. Says nothing about the numbers on file."
          exit 1

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "attendance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new attendance data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Attendance update: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

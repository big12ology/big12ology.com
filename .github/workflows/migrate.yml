name: Migrate

# Schema changes, by hand, on purpose.
#
# This used to be a step inside worker.yml, in front of a GitHub environment
# with a required reviewer. The reviewer is gone. Deploying without one is
# fine — `wrangler rollback` puts a bad script back in a minute and worker.yml
# does it automatically when the smoke test fails. Migrating without one is
# not, and the asymmetry is the whole reason this file exists:
#
#   a bad script is a minute's outage.
#   a bad migration is forward-only, and the way back is a restore.
#
# Rollback does not touch the schema. Worse, on a failed smoke test it reverts
# the script and leaves the migration applied, which lands production on new
# schema running old code — a combination nothing was ever tested against.
#
# So the two were split at the line where reversibility ends. Pushing to main
# still deploys unattended. Changing the shape of the database is a thing
# somebody does, with the database name typed out, having read what is about
# to be applied.
#
# Recovery, if it comes to that. Time Travel first — it is finer grained and
# needs no file. The step below prints a timestamp and a bookmark taken
# immediately before anything was applied, so the restore point does not have
# to be reconstructed after the fact:
#
#   cd worker
#   npx wrangler d1 time-travel restore b12_pickem --timestamp=<the one below>
#
# Time Travel keeps SEVEN DAYS on the Workers Free plan. Past that window the
# encrypted weekly artifact from backup.yml is the only copy, and note that
# the snapshot taken after a bad migration already contains the damage — the
# one you want is from the Sunday before it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the database name to confirm: b12_pickem"
        required: true
        type: string

concurrency:
  # The same group as worker.yml, so a deploy cannot land in the middle of a
  # migration and a migration cannot start under a deploy. No
  # cancel-in-progress, for the reason that file gives: a half-applied
  # migration is the one outcome worth queueing behind rather than
  # interrupting.
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      # Typing the name is not security — anyone who can dispatch this can
      # type six characters. It is there to make the act deliberate, which is
      # the part the reviewer was actually providing. A workflow you can start
      # by clicking Run is one you can start by clicking Run on the wrong tab.
      - name: Confirm the target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "b12_pickem" ] || {
            echo "::error::confirmation was '$CONFIRM', expected 'b12_pickem'."
            echo "::error::Nothing has been applied."
            exit 1
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: worker
        run: npm ci

      # The same suite worker.yml runs. A migration that breaks the tests has
      # no business reaching production, and the tests exercise the restore
      # path — export, wipe, import — against a local database, so they are
      # the only place the invariants get checked before this.
      #
      # They run against a LOCAL database. That is worth saying out loud: a
      # migration can pass every test here and still be wrong about real rows,
      # because the tests control the data and production does not. This step
      # rules out a broken migration, not a destructive one. Reading the diff
      # is still the job.
      - name: Test
        working-directory: worker
        run: node --test test/*.test.js

      - name: What is about to be applied
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations list b12_pickem --remote

      # BEFORE, not after. A bookmark taken once the migration has run points
      # at the damage. Both forms are printed because they fail differently:
      # the timestamp is what `--timestamp=` actually accepts and never changes
      # format, the bookmark is exact to the write. Captured verbatim rather
      # than parsed — this is for a person reading the log during a bad hour,
      # and a regex over wrangler's console output is one more thing that can
      # be wrong right then.
      - name: Mark the restore point
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "restore to this instant with:"
          echo "  npx wrangler d1 time-travel restore b12_pickem --timestamp=$(date -u +%s)"
          echo "  (that is $(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          echo
          npx wrangler d1 time-travel info b12_pickem

      - name: Apply
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply b12_pickem --remote

      # Not a formality. worker.yml refuses to deploy while anything is
      # unapplied, so a migration that half-succeeded here would block every
      # deploy afterwards with an error pointing back at this workflow. Better
      # to find that out on this run.
      - name: Nothing left over
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations list b12_pickem --remote

      - name: What happens now
        run: |
          cat <<'TXT'
          The schema is applied. The code that expects it is not deployed yet.

          worker.yml deploys on a push to main under worker/**. If the change
          that needed this migration is already merged, its deploy will have
          FAILED the schema check — re-run it from the Actions tab and it will
          pass now.

          Until then production is running the old code against the new
          schema, which is the ordering these migrations have to tolerate
          anyway: add columns and tables, never drop what the running version
          still reads.
          TXT

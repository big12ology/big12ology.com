name: Origin certificate watch

# Reports how long the GitHub Pages certificate for big12ology.com has left.
#
# NOT ON A SCHEDULE since 2026-10-12, and the reason is that its premise was
# wrong. This was written as an outage alarm: it said Cloudflare's SSL mode was
# Full (strict), which validates the origin, so an expired Pages certificate
# would give every visitor a 526 at once. The dashboard says otherwise. The
# mode is Automatic SSL/TLS and it runs as Full, which encrypts to the origin
# and accepts whatever certificate it is shown, an expired one included.
# Nothing a visitor sees depends on this certificate being in date.
#
# So when it fired at 18 days, for a certificate that expires 2026-10-30, the
# decision was to let it lapse. A weekly failure about something that is not a
# risk only teaches people to ignore the red mark.
#
# What it found is still true and worth knowing. GitHub does fail to renew:
# the Pages API reported the certificate as bad_authz, "The ACME authorization
# is in a bad state. We need to start over." GitHub proves control of the
# domain by resolving it, and while the records are proxied it resolves to
# Cloudflare's addresses and not GitHub's.
#
# PUT THE SCHEDULE BACK IF THE MODE EVER BECOMES FULL (STRICT), by hand or by
# an Automatic upgrade. Under strict everything the old header said is right,
# and the certificate has to be valid first:
#   1. Set the big12ology.com and www records to DNS only in Cloudflare.
#   2. Remove and re-add the custom domain in the repo's Pages settings, which
#      is what "start over" takes. The site is off the domain while it is out.
#   3. Wait for Pages to show the certificate issued, then proxy again.
#   4. Run this by hand to read the new expiry.
#
# How it checks: it connects to big12ology.github.io (never proxied) while
# sending SNI for big12ology.com, which is the handshake Cloudflare performs,
# so it reads the certificate GitHub serves and not the one Cloudflare does.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the origin certificate's remaining life
        env:
          ORIGIN_HOST: big12ology.github.io
          SNI: big12ology.com
          MIN_DAYS: "21"
        run: |
          set -euo pipefail

          cert=$(echo | openssl s_client -connect "${ORIGIN_HOST}:443" \
                   -servername "${SNI}" 2>/dev/null) || {
            echo "::error::could not complete a TLS handshake with ${ORIGIN_HOST}"
            exit 1
          }

          end=$(openssl x509 -noout -enddate <<<"$cert" | cut -d= -f2)
          [ -n "$end" ] || { echo "::error::no notAfter in the certificate"; exit 1; }

          end_epoch=$(date -u -d "$end" +%s)
          days=$(( (end_epoch - $(date -u +%s)) / 86400 ))

          echo "origin:  ${ORIGIN_HOST} (SNI ${SNI})"
          openssl x509 -noout -subject <<<"$cert"
          echo "expires: $end  (${days} days)"

          # The certificate must actually be for the custom domain. If GitHub
          # ever serves its default *.github.io certificate here, Cloudflare's
          # Full (strict) mode would reject the origin even though the dates
          # look fine — a valid certificate for the wrong name is still an
          # outage, so check the name as well as the clock.
          #
          # -checkhost rather than grepping the subject: it evaluates the SANs
          # the way a TLS client actually does, and it does not care how a given
          # OpenSSL build formats the text. The first version of this grepped
          # for "CN=${SNI}" and failed on the runner, which prints "CN = ..."
          # with spaces where macOS prints it without.
          openssl x509 -noout -checkhost "${SNI}" <<<"$cert" || {
            echo "::error::origin certificate is not valid for ${SNI}. Full (strict) would reject it; Full does not check."
            exit 1
          }

          if [ "$days" -lt "${MIN_DAYS}" ]; then
            echo "::error::Pages certificate expires in ${days} days (< ${MIN_DAYS})." \
                 "Not an outage while Cloudflare runs Full; it is one under Full (strict)." \
                 "To renew, follow the four steps at the top of this workflow."
            exit 1
          fi

          echo "OK — ${days} days of life left."

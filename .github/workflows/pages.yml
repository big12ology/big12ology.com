name: Build and deploy big12ology.com

# One workflow for the whole domain. It rebuilds the tiebreaker, assembles
# the hub, the tiebreaker and the attendance tracker into dist/, and deploys
# that as a single Pages artifact.
#
# The schedule is the tiebreaker's — it is the only part of the site with a
# reason to rebuild on a clock. A run redeploys the whole domain; output is
# deterministic, so the unchanged parts redeploy identical bytes.
#
# Run it by hand with "Deploy" unchecked for a dry run: it builds, compares
# the result against what is live, uploads dist/ for inspection, and does not
# touch Pages.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Pages (uncheck for a build-and-compare dry run)"
        type: boolean
        default: true
      refresh:
        description: "Also refetch ratings, closing lines and TV windows (+10 CFBD calls)"
        type: boolean
        default: false
      pools:
        description: "Pools section (dry run only): auto follows the date, open forces it"
        type: choice
        options: [auto, open, teaser]
        default: auto
  push:
    branches: [main]
  schedule:
    # Cron times are UTC. US game windows: Sat noon–midnight ET is
    # 16:00 Sat – 08:00 Sun UTC; Thu/Fri/Sun night games end in the next
    # UTC day's early hours. Aug included — the season opens Aug 29.
    #
    # THINNED, BECAUSE THIS IS NO LONGER THE SCORE CHANNEL. It used to run
    # every twenty minutes in a game window, and the reason was never that the
    # SITE needed rebuilding that often — it was that the Worker could only
    # read scores as a file on the Pages origin, so publishing a score meant
    # redeploying the domain. scores.yml now hands them to the Worker directly
    # and the pick'em boards move within seconds of a final, without a deploy.
    #
    # What is left here is static-page freshness: the tiebreaker's standings,
    # history and lab pages are built, not served, and they do go stale
    # between deploys. Hourly in a game window keeps that within an hour,
    # which is what the old schedule actually delivered anyway once GitHub's
    # drift is counted — measured on this repo, scheduled runs land a median
    # 19 minutes late, 130 at the 90th percentile, and one slot in ten never
    # fires at all.
    #
    # AND THE WORKER STILL TRIGGERS THIS. index.js's triggerDeploy dispatches
    # this workflow on Cloudflare's punctual clock, which is the path that
    # actually keeps the site current; these crons are the belt to that
    # braces, for when the token expires or the Worker is broken. That is why
    # thinning them is safe and why removing them would not be.
    # THE SMALL HOURS STAY HOURLY, and they are the exception worth stating.
    #
    # The Worker's trigger is every TWO hours in this window, not every hour —
    # DEPLOY_CRONS is "30 0-8/2 ..." there. So thinning this side to match it
    # interleaved as 00:00, 00:30, 02:00, 02:30 and left a NINETY MINUTE gap
    # between the pair, against sixty on a Saturday. That window is not idle
    # time: 00:00–08:00 UTC is exactly when Thursday, Friday and Sunday night
    # games finish in the US, so the widest gap in the schedule sat directly
    # under the results most likely to move the championship pages.
    #
    # Hourly here costs one rebuild an hour across eight hours on three nights
    # a week, which is still half the old rate and nowhere near Pages'
    # deployment limiting. It buys back the sixty-minute worst case.
    - cron: "0 * * 8-12 6,0"       # hourly Sat + Sun, Aug–Dec
    - cron: "0 0-8 * 8-12 1,5,6"   # hourly, small hours Mon/Fri/Sat
                                   # (Thu, Fri, and Sun night games)
    - cron: "0 18 * 8-12 *"        # daily catch-all, Aug–Dec
    - cron: "0 12 * 8-12 2"        # Tue — the weekly ratings/lines refresh

permissions:
  contents: write   # to commit the week's forecast back; see the step below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # THE BUILD NEEDS NODE NOW. The Big 12 rules are site/engine.js — the
      # same file the browser loads — and build.py runs them through
      # engine/cli.js rather than keeping a second copy of the ladder in
      # Python. No install: engine/ has no dependencies and no package.json,
      # for the same reason ci.yml says "every test here is stdlib".
      #
      # Pinned, not inherited. ubuntu-latest ships a node and it would work,
      # but the runner's default moves without anyone choosing it, and this is
      # the workflow that decides what the site says. Math.log and Math.exp
      # are not bit-specified by ECMA-262 and V8 has changed its ieee754
      # implementations before; an unpinned major here is a probability that
      # moves on a runner-image release note.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The CFBD key allows 1,000 calls a month and this workflow runs ~350
      # times a month in season, so a build gets one: the live season's scores.
      # tiebreaker/data/ is committed, so the finished seasons and the team
      # list cost nothing. Ratings and lines are worth nine more calls once
      # a week, not every hour. If the API refuses, the build says so and
      # falls back to the committed data rather than failing the deploy.
      # THE POOLS SWITCH, ON A DATE RATHER THAN A DEPLOY. The section opens
      # on 2026-08-20 and every deploy after that ships it; before then the
      # cron keeps publishing the teaser. The alternative was remembering to
      # push something on the morning of launch day, which is a plan that
      # depends on somebody being awake.
      #
      # Compared as an integer so there is no timezone argument: the crons
      # are UTC and so is this. Keep the date in step with POOLS_OPEN in
      # tiebreaker/build.py — that constant decides what the teaser says the
      # date IS, and this decides when the section actually appears.
      # THE OVERRIDE IS FOR DRY RUNS AND NOTHING ELSE. Every path the pools
      # section takes through this workflow — build.py with B12_PICKEM set,
      # assemble.sh's pools branch, the CSP writer over pages that carry an
      # app — is unreachable until the date arrives, so launch morning would
      # otherwise be the first time any of it ran. That is a poor day to find
      # out. `pools: open` on a dry run builds the open site, compares it
      # against what is live and uploads dist/ for inspection, and deploys
      # nothing.
      #
      # It is refused on a real deploy on purpose. POOLS_OPEN in build.py is
      # what the teaser quotes as the date; forcing the section open without
      # moving that constant ships a page promising the 20th directly above
      # pools that already work. Launching early is a code change, not a
      # checkbox.
      - name: Decide whether the pools section ships
        id: pools
        env:
          FORCE: ${{ inputs.pools }}
          DEPLOYING: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          if [ -n "$FORCE" ] && [ "$FORCE" != "auto" ] && [ "$DEPLOYING" = "true" ]; then
            echo "::error::pools=$FORCE is a dry-run override. Re-run with"
            echo "::error::Deploy unchecked, or move POOLS_OPEN in build.py"
            echo "::error::and the date below to launch for real."
            exit 1
          fi
          if [ "$FORCE" = "open" ]; then
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "pools: FORCED open for this dry run"
          elif [ "$FORCE" = "teaser" ]; then
            echo "on=" >> "$GITHUB_OUTPUT"
            echo "pools: FORCED teaser for this dry run"
          elif [ "$(date -u +%Y%m%d)" -ge 20260820 ]; then
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "pools: open"
          else
            echo "on=" >> "$GITHUB_OUTPUT"
            echo "pools: teaser until 2026-08-20"
          fi

      - name: Fetch results and build the tiebreaker
        working-directory: tiebreaker
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          B12_PICKEM: ${{ steps.pools.outputs.on }}
        run: >-
          python3 build.py --fetch
          ${{ (github.event.schedule == '0 12 * 8-12 2' || inputs.refresh)
              && '--refresh' || '' }}

      # The build writes tiebreaker/forecasts/<season>/week-NN.json. Odds are
      # recomputed and discarded every run, so a week that is not committed
      # here cannot be recovered later — there is no other record of what the
      # model believed at the time. Never fails the deploy: losing one
      # week's forecast is bad, taking the whole domain down over it is
      # worse.
      #
      # tiebreaker/pickem/ rides along for the same reason, one step harder:
      # the forecast is a record of an opinion, the slate is the number a
      # player is scored against. fetch_lines overwrites data/lines_<year>.json
      # on every refresh, so if a published week is not committed here, the
      # line it was played on is gone and the week cannot be graded at all.
      - name: Keep the week's forecast and slate
        id: keep
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        continue-on-error: true
        run: |
          git config user.name "tiebreaker-bot"
          git config user.email "actions@users.noreply.github.com"
          # games_<year>.json rides along, and it is what makes the skip
          # above work: without it every run starts from the same committed
          # copy, sees the same games still missing a result, and fetches
          # again. Committed, one run can see what the last one learned — so
          # a commit happens exactly when a score changed, and a quiet week
          # produces neither a commit nor a call.
          # ONE AT A TIME, AND ONLY WHAT EXISTS. These were one `git add` with
          # three pathspecs, and tiebreaker/pickem does not exist until a slate
          # has been published — so out of season git failed the whole
          # invocation with "pathspec did not match any files", staged NOTHING,
          # and took the step down with it under `bash -e`. continue-on-error
          # then turned that into a green run.
          #
          # The cost was not the missing slate directory, which had nothing in
          # it. It was games_<year>.json, which exists and does change: it is
          # what lets one run see what the last one learned, and without it
          # every run starts from the same committed copy, sees the same games
          # still missing a result, and asks CFBD again. The affordability
          # argument this whole schedule rests on was quietly not holding.
          for p in tiebreaker/forecasts tiebreaker/pickem \
                   tiebreaker/data/games_*.json; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "Forecast and slate unchanged."
          else
            git commit -m "Forecast: $(date -u +%Y-%m-%d)"
            git push || {
              git pull --rebase --autostash origin "${{ github.ref_name }}"
              git push
            }
          fi

      # The slate is published by the weekly refresh, which runs once. If that
      # run failed — a spent quota, a CFBD outage — the build falls back to
      # committed data and the domain stays up, which is right, and no slate
      # gets written, which is silent. The game simply has no week and nobody
      # finds out until someone goes to pick. Say it out loud instead, without
      # failing the deploy: the site not being down is still the priority.
      - name: Warn if the week has no slate
        id: slate_warn
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        continue-on-error: true
        working-directory: tiebreaker
        run: |
          python3 - <<'PY'
          import datetime, glob, json
          now = datetime.datetime.now(datetime.timezone.utc).timestamp()
          soon = []
          for p in sorted(glob.glob("pickem/*/week-*.json")):
              try:
                  lock = json.load(open(p)).get("lock_at")
              except (ValueError, OSError):
                  continue
              if lock and 0 < lock - now < 8 * 86400:
                  soon.append((p, lock))
          if soon:
              p, lock = soon[0]
              when = datetime.datetime.fromtimestamp(
                  lock, datetime.timezone.utc).strftime("%a %d %b %H:%M UTC")
              print(f"slate ready: {p} locks {when}")
          else:
              print("::warning::no pick'em slate locks in the next 8 days — "
                    "the weekly refresh may have failed, and the game has no "
                    "week until it succeeds")
          PY

      # This workflow also runs build.py --fetch, so it can be the run that
      # learns a final — and without this step that score would sit until
      # scores.yml next fired, which on a Tuesday is hours. Whoever learns it
      # publishes it. Posting an unchanged file is cheap and idempotent: the
      # Worker recomputes, finds nothing moved, and says so.
      #
      # continue-on-error, unlike the same step in scores.yml, and the
      # asymmetry is the point. There, publishing IS the job and a failure
      # must be loud. Here it is a bonus on top of a deploy, and taking the
      # domain's deploy down over it would be the tail wagging the dog.
      - name: Publish scores to the Worker
        id: publish
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        continue-on-error: true
        env:
          SCORES_INGEST_KEY: ${{ secrets.SCORES_INGEST_KEY }}
        run: tools/publish-scores.sh

      # SAY WHAT IT MEANT, not just that something failed.
      #
      # continue-on-error does two jobs and only one of them is wanted: it
      # keeps the run going, which is right, and it hides the failure, which is
      # not. A step's CONCLUSION is set to success when it is allowed to fail —
      # so the API, the green tick and every check that reads either of them
      # say the run was fine. Only `outcome` remembers, and only in here.
      #
      # Both of the bugs that shipped today were sitting in this blind spot for
      # runs on end. These two lines are the difference between a log somebody
      # has to go and read and a warning with words on it.
      - name: Say so if the commit-back failed
        if: always() && steps.keep.outcome == 'failure'
        run: |
          echo "::warning::the forecast and slate were NOT committed. Whatever"
          echo "::warning::this run learned is lost when the runner goes away —"
          echo "::warning::and games_<year>.json not landing means the next run"
          echo "::warning::asks CFBD the same questions again."

      - name: Say so if the publish failed
        if: always() && steps.publish.outcome == 'failure'
        run: |
          echo "::warning::the scores were NOT published to the Worker. The"
          echo "::warning::boards will wait for the next cron sweep rather than"
          echo "::warning::moving now, which is slow but not wrong. If this"
          echo "::warning::repeats, check SCORES_INGEST_KEY on both ends."

      - name: Assemble the three sites
        env:
          B12_PICKEM: ${{ steps.pools.outputs.on }}
        run: tools/assemble.sh dist

      # Dry run only: prove the assembled output is the site that is live.
      # Not when the pools gate is overridden. compare-live.sh exits non-zero
      # on any difference, and a forced-open build differs from the live site
      # by every page of the section on purpose — a guaranteed red X that
      # would hide a real one. The build succeeding through the open path is
      # the thing being tested; the artifact below is how you look at it.
      - name: Compare against what is live
        if: >-
          github.event_name == 'workflow_dispatch' && !inputs.deploy
          && (inputs.pools == 'auto' || inputs.pools == '')
        run: tools/compare-live.sh dist

      - name: Upload dist/ for inspection
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v6
        if: github.event_name != 'workflow_dispatch' || inputs.deploy

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        with:
          path: dist

      # THE CATCH-ALL, so the next one does not need a step written for it.
      #
      # The two warnings above name a specific failure and say what it costs.
      # This one needs no foreknowledge: it walks every step that has an id and
      # reports any whose outcome was failure, including ones added after this
      # was written.
      #
      # toJSON(steps) only sees steps that carry an `id`, which is the one
      # thing to remember — a continue-on-error step with no id is invisible
      # here as well as everywhere else. Giving it an id is the whole cost of
      # being covered.
      #
      # Warns rather than fails, deliberately. A quiet failure is worth
      # knowing about; it is not worth turning a deploy that otherwise worked
      # into a red run somebody learns to ignore. Making it fail is a one-word
      # change if that judgement turns out to be wrong.
      - name: Report any step that failed quietly
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS"])
          bad = [k for k, v in steps.items() if v.get("outcome") == "failure"]
          if bad:
              print("::warning::these steps failed without stopping the run: "
                    + ", ".join(sorted(bad)))
              print("::warning::the run is green because they are "
                    "continue-on-error. They still did not do their job.")
          else:
              print(f"no quiet failures ({len(steps)} steps with an id checked)")
          PY

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Deploying the pick'em Worker.
#
# Deliberately NOT part of pages.yml. That workflow runs about three hundred
# times a season with cancel-in-progress, and merging them would hand a
# Cloudflare write token to every one of those runs, redeploy the Worker on
# every hourly score refresh, and — worst — let a cancelled run abort a
# migration halfway through applying.
#
# This runs only when worker/ changes, and it runs unattended. It used to
# pause for a required reviewer; that gate was removed on 2026-08-12, and what
# it had really been guarding — `d1 migrations apply --remote` writing to the
# live database — moved out to migrate.yml rather than losing its pause along
# with it. A script this deploys can be rolled back in a minute and is, below,
# automatically. A schema cannot.

name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  # No cancel-in-progress. A half-applied migration is the one outcome worth
  # queueing behind rather than interrupting.
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # THIS ENVIRONMENT NO LONGER HAS A REQUIRED REVIEWER. It was removed on
    # 2026-08-12, and this file used to claim otherwise in three places.
    #
    # Deploying unattended is the right call: the smoke test below catches a
    # bad script and rolls it back on its own, faster than a person would.
    # What the reviewer was really standing in front of was the migration
    # step, which rollback cannot undo — so that moved to migrate.yml, which
    # runs only by hand. See the header there.
    #
    # The environment stays for what it still does: it scopes the Cloudflare
    # token and it records these deploys in GitHub's deployment history. It is
    # a name, not a gate. Do not read it as one.
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Test
        working-directory: worker
        run: node --test test/*.test.js

      # THE ROUTE IS THE BLAST RADIUS.
      #
      # big12ology.com is a static site behind Cloudflare's proxy. A route of
      # "big12ology.com/*" would put this Worker in front of every page on the
      # domain, and a Custom Domain on the apex would replace the A records and
      # take the site off the internet entirely. Neither is a plausible typo to
      # notice in review, and both are a total outage.
      #
      # So the exact strings are asserted here, before anything is deployed,
      # rather than trusted to have stayed correct.
      - name: The route is exactly /api/*
        working-directory: worker
        run: |
          python3 - <<'PY'
          import re, sys
          cfg = open("wrangler.toml").read()
          patterns = re.findall(r'pattern\s*=\s*"([^"]+)"', cfg)
          expected = ["big12ology.com/api/*", "big12ology.com/api"]
          if patterns != expected:
              sys.exit(f"REFUSING TO DEPLOY. routes are {patterns}, "
                       f"expected exactly {expected}")
          if re.search(r'^\s*\[\[?routes?\]\]?', cfg, re.M) and "zone_name" not in cfg:
              sys.exit("REFUSING TO DEPLOY: a route with no zone_name")
          for bad in ('pattern = "big12ology.com/*"', "[[custom_domains]]",
                      "workers_dev = true"):
              if bad in cfg:
                  sys.exit(f"REFUSING TO DEPLOY: found {bad!r}")
          print(f"routes ok: {patterns}")
          PY

      # MIGRATIONS ARE NOT APPLIED HERE ANY MORE. They live in migrate.yml,
      # which runs only by hand — that file's header says why.
      #
      # This step is what makes the split safe rather than merely smaller. The
      # failure a split introduces is the mirror image of the one it removes:
      # code shipped ahead of the schema it expects, which is a Worker taking
      # picks against a column that does not exist yet. So nothing deploys
      # until every migration on disk is recorded in the database.
      #
      # It reads d1_migrations directly rather than parsing
      # `wrangler d1 migrations list`, whose output is presentation and has
      # changed between versions. d1_migrations is wrangler's default and
      # wrangler.toml sets migrations_dir without overriding migrations_table
      # — and if that ever stops being true this fails closed, which is the
      # only safe direction for a check whose whole job is to say "yes, the
      # database is ready".
      - name: The schema is already where this code expects it
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if ! npx wrangler d1 execute b12_pickem --remote --json \
                 --command "SELECT name FROM d1_migrations ORDER BY name" \
                 > /tmp/applied.json 2>/tmp/applied.err; then
            echo "::error::could not read d1_migrations:"
            sed 's/^/::error::  /' /tmp/applied.err
            echo "::error::REFUSING TO DEPLOY rather than guess whether the"
            echo "::error::schema is current."
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, sys

          raw = pathlib.Path("/tmp/applied.json").read_text()

          # wrangler puts a banner in front of the JSON often enough that
          # json.loads on the whole buffer is not reliable. Scan for the first
          # position that decodes cleanly instead of trusting a fixed offset.
          dec, doc = json.JSONDecoder(), None
          for i, ch in enumerate(raw):
              if ch in "[{":
                  try:
                      doc, _ = dec.raw_decode(raw[i:])
                      break
                  except ValueError:
                      continue
          if doc is None:
              sys.exit("::error::REFUSING TO DEPLOY: no JSON in the d1 output")

          if isinstance(doc, dict):
              doc = [doc]
          applied = {r["name"] for blk in doc for r in blk.get("results", [])}
          if not applied:
              sys.exit("::error::REFUSING TO DEPLOY: d1_migrations came back "
                       "empty. 0001_init has been applied since the pool "
                       "opened, so this is a query that did not work, not a "
                       "database that is behind.")

          on_disk = {p.name for p in pathlib.Path("migrations").glob("*.sql")}

          missing = sorted(on_disk - applied)
          if missing:
              print("::error::REFUSING TO DEPLOY. These migrations are on "
                    "disk but not in the database:")
              for m in missing:
                  print(f"::error::  {m}")
              print("::error::Run the Migrate workflow (migrate.yml), then "
                    "re-run this one from the Actions tab.")
              sys.exit(1)

          # Not fatal. The database being ahead of the code is what a revert
          # looks like, and these migrations are additive by rule, so the old
          # Worker can run against the newer schema. Worth saying, not worth
          # blocking on.
          extra = sorted(applied - on_disk)
          if extra:
              print("::warning::applied but not on disk (reverted code?): "
                    + ", ".join(extra))

          print(f"schema ok: {len(applied)} migrations applied, "
                f"{len(on_disk)} on disk")
          for m in sorted(on_disk):
              print(f"  {m}")
          PY

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A deploy that returns 200 on /api/health but has lost the static site
      # is the failure this whole file is arranged around, so both are checked.
      # A failing smoke test used to be a red run and a live broken Worker:
      # the deploy has already happened by the time anything is checked, so
      # detection without remediation just means somebody has to be watching.
      # `id` and `continue-on-error` let the failure be caught below instead
      # of ending the job here.
      - name: Smoke
        id: smoke
        continue-on-error: true
        run: |
          set -e
          sleep 5
          code=$(curl -s -o /tmp/h -w '%{http_code}' https://big12ology.com/api/health)
          echo "health: $code $(cat /tmp/h)"
          [ "$code" = "200" ] || { echo "health did not answer"; exit 1; }
          grep -q '"ok":true' /tmp/h || { echo "health says not ok"; exit 1; }
          for p in / /tiebreaker/ /schedule/ /attendance/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://big12ology.com$p")
            echo "  $p -> $c"
            [ "$c" = "200" ] || { echo "THE STATIC SITE IS DOWN at $p"; exit 1; }
          done

      # Put the previous version back, immediately, without waiting for a
      # person to notice. --message skips the interactive confirmation, and
      # with no version id it returns to the one uploaded before this deploy.
      #
      # NOT the migrations. Those are forward-only and this does not undo
      # them, which is the asymmetry worth knowing: a bad script is a minute's
      # outage, a bad migration is a restore from Time Travel or from the
      # weekly snapshot.
      #
      # That asymmetry is why migrating is no longer part of this workflow. If
      # it still were, this step would be actively harmful: it would put the
      # old script back on top of the new schema and call that a recovery.
      # Migrations happen in migrate.yml, deliberately, with a restore point
      # printed before anything is applied.
      - name: Roll back a bad deploy
        if: steps.smoke.outcome == 'failure'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::error::the smoke test failed; rolling back"
          npx wrangler rollback --message "smoke test failed on ${{ github.sha }}"
          sleep 5
          code=$(curl -s -o /tmp/h2 -w '%{http_code}' https://big12ology.com/api/health)
          echo "after rollback: $code $(cat /tmp/h2 || true)"
          for p in / /tiebreaker/ /schedule/ /attendance/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://big12ology.com$p")
            echo "  $p -> $c"
          done

      # And still fail the run. A rollback is not a success; it is the site
      # being back where it was before this push, with the change that was
      # meant to ship not shipped and nobody told unless this run goes red.
      - name: Report the smoke result
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# Deploying the pick'em Worker.
#
# Deliberately NOT part of pages.yml. That workflow runs about three hundred
# times a season with cancel-in-progress, and merging them would hand a
# Cloudflare write token to every one of those runs, redeploy the Worker on
# every hourly score refresh, and — worst — let a cancelled run abort a
# migration halfway through applying.
#
# This runs only when worker/ changes, and it pauses for a human before it
# touches production, because `d1 migrations apply --remote` writes to the
# live database.

name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  # No cancel-in-progress. A half-applied migration is the one outcome worth
  # queueing behind rather than interrupting.
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A GitHub environment with a required reviewer. The gate is the point:
    # everything above this line is safe to run unattended and everything
    # below it writes to production.
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Test
        working-directory: worker
        run: node --test test/*.test.js

      # THE ROUTE IS THE BLAST RADIUS.
      #
      # big12ology.com is a static site behind Cloudflare's proxy. A route of
      # "big12ology.com/*" would put this Worker in front of every page on the
      # domain, and a Custom Domain on the apex would replace the A records and
      # take the site off the internet entirely. Neither is a plausible typo to
      # notice in review, and both are a total outage.
      #
      # So the exact strings are asserted here, before anything is deployed,
      # rather than trusted to have stayed correct.
      - name: The route is exactly /api/*
        working-directory: worker
        run: |
          python3 - <<'PY'
          import re, sys
          cfg = open("wrangler.toml").read()
          patterns = re.findall(r'pattern\s*=\s*"([^"]+)"', cfg)
          expected = ["big12ology.com/api/*", "big12ology.com/api"]
          if patterns != expected:
              sys.exit(f"REFUSING TO DEPLOY. routes are {patterns}, "
                       f"expected exactly {expected}")
          if re.search(r'^\s*\[\[?routes?\]\]?', cfg, re.M) and "zone_name" not in cfg:
              sys.exit("REFUSING TO DEPLOY: a route with no zone_name")
          for bad in ('pattern = "big12ology.com/*"', "[[custom_domains]]",
                      "workers_dev = true"):
              if bad in cfg:
                  sys.exit(f"REFUSING TO DEPLOY: found {bad!r}")
          print(f"routes ok: {patterns}")
          PY

      - name: Migrate
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply b12_pickem --remote

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A deploy that returns 200 on /api/health but has lost the static site
      # is the failure this whole file is arranged around, so both are checked.
      # A failing smoke test used to be a red run and a live broken Worker:
      # the deploy has already happened by the time anything is checked, so
      # detection without remediation just means somebody has to be watching.
      # `id` and `continue-on-error` let the failure be caught below instead
      # of ending the job here.
      - name: Smoke
        id: smoke
        continue-on-error: true
        run: |
          set -e
          sleep 5
          code=$(curl -s -o /tmp/h -w '%{http_code}' https://big12ology.com/api/health)
          echo "health: $code $(cat /tmp/h)"
          [ "$code" = "200" ] || { echo "health did not answer"; exit 1; }
          grep -q '"ok":true' /tmp/h || { echo "health says not ok"; exit 1; }
          for p in / /tiebreaker/ /schedule/ /attendance/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://big12ology.com$p")
            echo "  $p -> $c"
            [ "$c" = "200" ] || { echo "THE STATIC SITE IS DOWN at $p"; exit 1; }
          done

      # Put the previous version back, immediately, without waiting for a
      # person to notice. --message skips the interactive confirmation, and
      # with no version id it returns to the one uploaded before this deploy.
      #
      # NOT the migrations. Those are forward-only and this does not undo
      # them, which is the asymmetry worth knowing: a bad script is a minute's
      # outage, a bad migration is a restore from Time Travel or from the
      # weekly snapshot. That is also why the environment gate sits in front
      # of this job.
      - name: Roll back a bad deploy
        if: steps.smoke.outcome == 'failure'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::error::the smoke test failed; rolling back"
          npx wrangler rollback --message "smoke test failed on ${{ github.sha }}"
          sleep 5
          code=$(curl -s -o /tmp/h2 -w '%{http_code}' https://big12ology.com/api/health)
          echo "after rollback: $code $(cat /tmp/h2 || true)"
          for p in / /tiebreaker/ /schedule/ /attendance/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://big12ology.com$p")
            echo "  $p -> $c"
          done

      # And still fail the run. A rollback is not a success; it is the site
      # being where it was before somebody pressed approve.
      - name: Report the smoke result
        if: steps.smoke.outcome == 'failure'
        run: exit 1

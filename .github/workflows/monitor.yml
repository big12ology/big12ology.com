# Somebody looking, so it is not always you.
#
# Every failure this project has that matters is quiet. The cron stops and the
# boards keep serving Saturday's numbers. The token expires and deploys fail
# into a tab nobody has open. CI goes red and stays red — that one is not
# hypothetical: it sat red for a day during development while every local
# suite passed, and was found by going and looking rather than by being told.
#
# This is the cheapest possible answer to that: a scheduled request, and a job
# that fails when the answer is wrong. GitHub emails a failed scheduled run to
# whoever last touched the cron, which is the notification channel this project
# already has and does not have to be paid for.
#
# It deliberately does NOT check that the numbers are right — the tests do
# that, against a database they control. This checks the things only
# production can answer: is it up, is it serving the site, and is the thing
# that runs unattended still running.

name: Monitor

on:
  schedule:
    # Every six hours, because this is the BACKSTOP rather than the watch.
    #
    # Uptime Kuma does the minute-by-minute checking now, and does it better:
    # sixty-second intervals, retries before it decides, real alerting. What
    # it cannot do is notice its own death — it runs on hardware you own, so
    # if that box goes down you lose the monitoring and the ability to hear
    # about it in the same instant.
    #
    # This runs on somebody else's infrastructure, which is the entire point.
    # Six hours is slow for an outage and exactly right for "has the thing
    # that watches everything stopped watching".
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: read
  actions: read      # api-budget.py reads the run history to derive spend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The site is up
        run: |
          set -e
          fail=0
          for p in / /tiebreaker/ /schedule/ /attendance/ /pools/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                  "https://big12ology.com$p" || echo 000)
            echo "  $p -> $c"
            [ "$c" = "200" ] || { echo "::error::$p answered $c"; fail=1; }
          done
          exit $fail

      # BETTER TO KNOW ON THE 4TH THAN THE 28TH. The CFBD plan is a hard
      # 1,000 calls a month and there is no topping it up, so the failure
      # mode is the site quietly falling back to committed data for the last
      # week of a month. This compares spend against what the cron schedule
      # alone should cost and warns on the RATE, not the total — a total
      # only trips once it is too late to change anything.
      #
      # Warns, never fails: this job also watches whether the site is up, and
      # a workflow that cries about a budget is a workflow somebody mutes.
      - uses: actions/checkout@v7
      - name: The CFBD budget is on track
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/api-budget.py --check

      - name: The API is up, and doing its job
        run: |
          set -e
          body=$(curl -s --max-time 20 https://big12ology.com/api/health || echo '{}')
          echo "$body"

          ok=$(printf '%s' "$body" | python3 -c \
            'import json,sys;print(json.load(sys.stdin).get("ok"))' 2>/dev/null || echo None)
          [ "$ok" = "True" ] || { echo "::error::/api/health says $ok"; exit 1; }

          # The quiet failure. A week whose deadline has passed and which has
          # never been graded means the cron is not running — the API will go
          # on answering perfectly while the boards freeze.
          waiting=$(printf '%s' "$body" | python3 -c \
            'import json,sys;print(json.load(sys.stdin).get("waiting_s") or 0)')
          echo "  oldest ungraded locked week: ${waiting}s"
          if [ "$waiting" -gt 7200 ]; then
            echo "::error::a week locked ${waiting}s ago has never been scored."
            echo "::error::The cron is not running, or it is failing. Check the"
            echo "::error::Worker's logs and the last Worker workflow run."
            exit 1
          fi

      - name: The Worker route still only owns /api/*
        run: |
          set -e
          # The single worst outcome available here: a route of /* would put
          # the Worker in front of every page on the domain. It is asserted at
          # deploy time from wrangler.toml, and asserted again here from the
          # outside, because the route can also be edited in the dashboard.
          body=$(curl -s --max-time 20 https://big12ology.com/ || echo '')
          printf '%s' "$body" | grep -q 'Big12ology' || {
            echo "::error::the homepage is not the homepage — is a Worker"
            echo "::error::answering for it?"
            exit 1
          }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   https://big12ology.com/api/definitely-not-a-route)
          [ "$code" = "404" ] || {
            echo "::error::/api/<nonsense> answered $code, expected 404"
            exit 1
          }

      # THE PUBLISHER IS STILL REMEMBERING WHAT IT LEARNED.
      #
      # This exists because the commit-back in pages.yml was broken for the
      # whole of its life and nothing said so. `git add` was handed a pathspec
      # that did not exist, failed the whole invocation, staged nothing, and
      # died under `bash -e` — and continue-on-error turned that into a green
      # run. Two bot commits in the repo's history was the only symptom, and
      # nobody counts commits.
      #
      # It cannot be caught from the outside by reading step results: a step
      # allowed to fail reports conclusion=success, and the REST API does not
      # expose `outcome` at all. The failure is only visible inside the job
      # that produced it. So this watches the CONSEQUENCE instead — if the
      # publisher is working, tiebreaker-bot commits when a score moves, and
      # in season it moves most weeks.
      #
      # Warns, never fails, and only in season. Out of season no games finish,
      # nothing changes, and no commit is the correct behaviour rather than a
      # fault — failing on it all winter is how an alarm gets muted.
      - name: The publisher is still committing what it learns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          month=$(date -u +%m)
          if [ "$month" -lt 8 ] || [ "$month" -gt 12 ]; then
            echo "out of season (month $month) — nothing is expected to move."
            exit 0
          fi

          # By author NAME, not the GitHub `author` filter: the bot commits as
          # actions@users.noreply.github.com, which belongs to no account, so
          # the API's author query matches nothing and would report a healthy
          # publisher as silent forever.
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=100" \
                   --jq '[.[] | select(.commit.author.name == "tiebreaker-bot")
                          | .commit.author.date] | first // empty')

          if [ -z "$last" ]; then
            # August before the opener is the one time "no commits ever" is
            # the truth rather than a fault: 2026 opens on the 29th, so there
            # is nothing to have learned yet. Warning through the whole of
            # August would train somebody to skip these runs by September,
            # which is the fortnight this check exists for.
            if [ "$month" = "08" ]; then
              echo "no bot commits yet, and the season has not opened."
              exit 0
            fi
            echo "::warning::no tiebreaker-bot commit in the last 100, in"
            echo "::warning::month ${month}. The commit-back is failing, or the"
            echo "::warning::publisher is not running. Check a recent Scores or"
            echo "::warning::Pages run for a 'commit-back failed' warning."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "last tiebreaker-bot commit: $last (${age} days ago)"
          if [ "$age" -gt 8 ]; then
            echo "::warning::the publisher has not committed in ${age} days."
            echo "::warning::In season that usually means the commit-back is"
            echo "::warning::failing quietly, and every run is re-asking CFBD"
            echo "::warning::for results it already had."
          fi

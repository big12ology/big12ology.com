name: Update site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Cron times are UTC. US game windows: Sat noon–midnight ET is
    # 16:00 Sat – 08:00 Sun UTC; Thu/Fri night games end by ~08:00 UTC.
    - cron: "0 * * 9-12 6,0"     # hourly Sat + Sun, Sep–Dec
    - cron: "0 0-8/2 * 9-12 5,6" # every 2h Fri/Sat early UTC (Thu/Fri night games)
    - cron: "0 18 * 8-12 *"      # daily catch-all, Aug–Dec

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results and build site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 build.py --fetch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

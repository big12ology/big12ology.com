name: Tests

# The tests, on every change — which until now nothing did.
#
# pages.yml rebuilds and deploys the tiebreaker ~300 times a season and runs no
# tests at all; attendance-data.yml runs its own two suites, but only on its own
# data-fetch schedule, and never on a pull request. So the ten tiebreaker tests
# — including test_parity.py, the one thing standing between engine.js and
# tiebreaker.py drifting apart — have been local-only, on a repo whose deploy is
# automatic. A change could reach the live site without a single test running.
#
# This workflow exists to close that. It fetches nothing, spends no CFBD quota,
# and touches no credentials: every test here runs against committed data.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow proves things; it does not change them.
permissions:
  contents: read

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 matches pages.yml, which is what actually builds the site.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 22 for node:sqlite, which the worker's schema tests use to prove the
      # D1 triggers fire. test_parity.py also shells out to node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # These are scripts, not unittest cases: each one prints its own summary
      # and exits non-zero on failure. `unittest discover` finds no TestCase in
      # them, reports "NO TESTS RAN", and exits 0 — it imports each module,
      # which runs the checks and prints, so it looks convincingly like a pass
      # while asserting nothing. Run them the way they are written.
      - name: Tiebreaker
        working-directory: tiebreaker
        run: |
          fail=0
          for t in tests/test_*.py; do
            if out=$(python3 "$t" 2>&1); then
              printf '  PASS  %-24s %s\n' "$(basename "$t")" "$(echo "$out" | tail -1)"
            else
              printf '  FAIL  %-24s\n' "$(basename "$t")"
              echo "$out" | sed 's/^/        /'
              fail=1
            fi
          done
          exit $fail

      # Named files, not the directory: `node --test tests/` also picks up
      # fixture-2025-sheet.json and dies on it.
      - name: Attendance
        working-directory: attendance
        run: |
          node --test tests/parity.test.mjs tests/render.test.mjs
          python3 -m unittest discover -s tests

      # No npm install: every test here is stdlib. node:sqlite runs the real
      # migration and attacks its triggers, so the schema is covered without a
      # database, a container, or a dependency to audit. wrangler is a
      # devDependency of the deploy workflow's concern, not this one.
      #
      # Named files, not the directory: `node --test worker/test/` treats the
      # path as a module to load and dies before running anything — the same
      # shape of trap as the attendance suite's JSON fixture.
      - name: Worker
        run: |
          if compgen -G "worker/test/*.test.js" > /dev/null; then
            node --test worker/test/*.test.js
          else
            echo "no worker tests yet — skipping"
          fi

      # assemble.sh only copies — it does not build. Two of the files its
      # manifest insists on, tiebreaker/index.html and history.html, are
      # gitignored because they are regenerated on every build and would
      # churn the repo, so a fresh checkout does not have them and the
      # assemble step failed on every run of this workflow. Build first,
      # the way pages.yml does. No --fetch: there is no CFBD key here and
      # committed data/ is what the tests are about anyway.
      - name: Build the tiebreaker
        working-directory: tiebreaker
        run: python3 build.py

      # The build gates are themselves untested code, and one of them now
      # stands between a Worker's client secrets and the public web. Assembling
      # here proves the manifest, the cache-bust rule, the CNAME check and the
      # must-not-ship gate all still run clean.
      - name: Assemble
        run: tools/assemble.sh dist

name: Tests

# The tests, on every change — which until now nothing did.
#
# pages.yml rebuilds and deploys the tiebreaker ~1,800 times a season and runs no
# tests at all; attendance-data.yml runs its own two suites, but only on its own
# data-fetch schedule, and never on a pull request. So the tiebreaker tests —
# including test_engine.py, which is now the only thing standing between the
# rules engine and the answers it used to give — have been local-only, on a
# repo whose deploy is automatic. A change could reach the live site without a
# single test running.
#
# This workflow exists to close that. It fetches nothing, spends no CFBD quota,
# and touches no credentials: every test here runs against committed data.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow proves things; it does not change them.
permissions:
  contents: read

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 matches pages.yml, which is what actually builds the site.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 22 for node:sqlite, which the worker's schema tests use to prove the
      # D1 triggers fire. test_parity.py also shells out to node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # These are scripts, not unittest cases: each one prints its own summary
      # and exits non-zero on failure. `unittest discover` finds no TestCase in
      # them, reports "NO TESTS RAN", and exits 0 — it imports each module,
      # which runs the checks and prints, so it looks convincingly like a pass
      # while asserting nothing. Run them the way they are written.
      - name: Tiebreaker
        working-directory: tiebreaker
        run: |
          fail=0
          for t in tests/test_*.py; do
            if out=$(python3 "$t" 2>&1); then
              printf '  PASS  %-24s %s\n' "$(basename "$t")" "$(echo "$out" | tail -1)"
            else
              printf '  FAIL  %-24s\n' "$(basename "$t")"
              echo "$out" | sed 's/^/        /'
              fail=1
            fi
          done
          exit $fail

      # Named files, not the directory: `node --test tests/` also picks up
      # fixture-2025-sheet.json and dies on it.
      # The pick'em client is a browser file, so it needs a browser-shaped
      # test rather than the script runner above.
      - name: Pickem client
        run: node --test tiebreaker/tests/pickem_render.test.mjs

      # The Lab's race card is a browser port of clinch.py, odds.py and
      # chaos.py, so the Python suite above cannot reach it. Reads the
      # payload out of the built pages, so it runs after the build step.
      - name: Race card client
        working-directory: tiebreaker
        run: node --test tests/race_client.test.mjs

      - name: Attendance
        working-directory: attendance
        run: |
          node --test tests/parity.test.mjs tests/render.test.mjs
          python3 -m unittest discover -s tests

      # THE RULES ARE JAVASCRIPT NOW, so this is the only static analysis the
      # most correctness-critical code on the site can have. checkJs over plain
      # .js with JSDoc: nothing is transpiled, nothing is emitted, and the
      # files stay the exact files the browser loads.
      #
      # It earned its place on the first run, on code written a day earlier:
      # `for (const i in cond)` hands back the key as a string, so `c >> i` was
      # shifting by "3" and getting the right answer through coercion — the
      # same shape as the `28 > null` bug that once cost eight files across
      # four runtimes.
      #
      # typescript and @types/node are pinned exactly and live in the Worker's
      # node_modules, the only one in the repo. A red run here does not block a
      # deploy: pages.yml has no `needs` on this workflow.
      - name: Type-check the engine
        run: |
          (cd worker && npm ci --silent)
          worker/node_modules/.bin/tsc -p tiebreaker/jsconfig.json

      # The TESTS are all stdlib and install nothing: node:sqlite runs the real
      # migration and attacks its triggers, so the schema is covered without a
      # database, a container, or a dependency to audit. (This said "no npm
      # install" full stop until the type check above arrived. What changed is
      # worth stating exactly: nothing the site RUNS gained a dependency, and
      # no test needs one — tsc reads the engine and emits nothing.)
      #
      # Named files, not the directory: `node --test worker/test/` treats the
      # path as a module to load and dies before running anything — the same
      # shape of trap as the attendance suite's JSON fixture.
      - name: Worker
        run: |
          if compgen -G "worker/test/*.test.js" > /dev/null; then
            node --test worker/test/*.test.js
          else
            echo "no worker tests yet — skipping"
          fi

      # assemble.sh only copies — it does not build. Two of the files its
      # manifest insists on, tiebreaker/index.html and history.html, are
      # gitignored because they are regenerated on every build and would
      # churn the repo, so a fresh checkout does not have them and the
      # assemble step failed on every run of this workflow. Build first,
      # the way pages.yml does. No --fetch: there is no CFBD key here and
      # committed data/ is what the tests are about anyway.
      - name: Build the tiebreaker
        working-directory: tiebreaker
        run: python3 build.py

      # The build gates are themselves untested code, and one of them now
      # stands between a Worker's client secrets and the public web. Assembling
      # here proves the manifest, the cache-bust rule, the CNAME check and the
      # must-not-ship gate all still run clean.
      - name: Assemble
        run: tools/assemble.sh dist

      # And again with the pick'em switched on. The section is dark on
      # production until the Worker exists and privacy.html is rewritten,
      # which means nothing else in this workflow would ever build it — a
      # gated-off section that CI never compiles rots quietly and is
      # discovered on the day you try to turn it on. This is the only run
      # that exercises build_pickem, the pick'em sitemap, the section's own
      # required-file manifest and its stricter cache-bust rule.
      - name: Build and assemble with the pick'em on
        env:
          B12_PICKEM: "1"
        run: |
          (cd tiebreaker && python3 build.py)
          tools/assemble.sh dist
          test -s dist/pools/index.html
          test -s dist/pools/pickem/index.html
          test -s dist/pools/account.html
          test -s dist/pools/sitemap.xml
          # /pickem/ shipped before the games were grouped; it stays as a
          # redirect for as long as anything still links to it.
          grep -q 'url=/pools/pickem/' dist/pickem/index.html
          # The hand-written files switch too, via PICKEM-ONLY/PICKEM-OFF.
          grep -q '/pools/' dist/index.html
          grep -q '__Host-b12s' dist/privacy.html
          grep -q 'pools' dist/sitemap.xml
          ! grep -q 'no accounts, no cookies' dist/privacy.html
          test ! -e dist/pools/soon.html
          test ! -e dist/pools/_moved
          ! grep -rq 'PICKEM-ONLY\|PICKEM-OFF' dist
          # A generated topbar, not dist/index.html: the four hand-written
          # pages carry a PICKEM-LINK marker instead, because the flag cannot
          # reach into a file build.py does not write.
          #
          # The label is Pools, not Pickem — it has been since the games were
          # grouped under one section, and this line went on asserting the old
          # one for a fortnight of red runs. The link is now unconditional,
          # because /pools/ is a real destination either way: the section when
          # the flag is on and the teaser when it is off. So it is asserted in
          # both shapes below rather than treated as a lit-only tell.
          grep -q 'href="/pools/">Pools<' dist/tiebreaker/index.html

      # Back to the shipping shape, so nothing downstream sees the dark
      # section's output.
      - name: Reassemble as production
        run: |
          (cd tiebreaker && python3 build.py)
          tools/assemble.sh dist
          # /pickem/ is a real page either way now: the section when the flag
          # is on, the Coming Soon teaser when it is off. So what is asserted
          # dark is that the teaser is there and NOTHING ELSE is — no slate,
          # no app.js, nothing that would try to talk to an API that does not
          # exist yet.
          test -s dist/pools/index.html
          test -s dist/pools/shots/slate.png
          # Matched on the teaser's own structure, not on its wording. This
          # was `grep -q 'Coming soon'` and went red the day the eyebrow
          # started naming the opening date instead — a copy edit failing a
          # build that was otherwise entirely correct. What the assertion
          # means is "the dark assembly published the teaser rather than the
          # section", and soonhero is the thing that is actually true of one
          # and not the other.
          grep -q 'class=soonhero' dist/pools/index.html
          test ! -e dist/pools/app.js
          test ! -e dist/pools/pickem
          test ! -e dist/pools/survivor
          test ! -e dist/pools/data
          # Dark, the stub has to land on the teaser: /pools/pickem/ is not
          # built, so pointing at it sent the old URL's readers to a 404.
          grep -q 'url=/pools/' dist/pickem/index.html
          ! grep -q 'url=/pools/pickem/' dist/pickem/index.html
          # The teaser still has to be reachable from every generated page,
          # or the Coming Soon page is one nobody can find.
          grep -q 'href="/pools/">Pools<' dist/tiebreaker/index.html
          ! grep -rq 'pickcon' dist
          # And the disclosure still matches what is actually running.
          grep -q 'no accounts, no cookies' dist/privacy.html
          # Dark, privacy.html must still make the promise that is true.
          ! grep -rq 'PICKEM-ONLY\|PICKEM-OFF' dist

      # Everything above asks whether the right files exist. This asks whether
      # everything that points at a file finds one — a renamed page, a logo
      # that never got copied, a sitemap entry for something nobody built.
      # None of those fail a build; all of them reach a reader.
      - name: Verify the assembled site
        run: |
          # Production first: dist is still the dark assembly from the step
          # above.
          tools/verify-dist.py dist
          # Then with the section on, which is the half that actually moves.
          (cd tiebreaker && B12_PICKEM=1 python3 build.py)
          B12_PICKEM=1 tools/assemble.sh dist
          tools/verify-dist.py dist
          # And the numbers on the page against the two other places the
          # build publishes the same ones.
          tools/verify-consistency.py dist

      # pages.yml redeploys on a cron roughly 1,800 times a season and
      # its opening comment says unchanged content produces identical bytes.
      # That is load-bearing — it is what makes an actual change visible — and
      # nothing checked it until a rebuild was found rewriting data.json and
      # feed.xml on every run purely for a timestamp.
      - name: Verify the build is deterministic
        run: tools/verify-deterministic.sh

<!doctype html>
<!-- Source for og.png. Open at exactly 1200x630 and screenshot it:
     the card is a static page so the image can always be regenerated
     rather than hand-edited. Keep it in step with the tiebreaker's card. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Big 12 Attendance Tracker — social card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    background: #ffffff; color: #1a1c20;
    display: flex; flex-direction: column;
  }
  .top { padding: 34px 78px; font-size: 26px; font-weight: 700;
         color: #6b7280; letter-spacing: -0.2px; }
  .rule { height: 9px; background: #c8102e; }
  .body { flex: 1; background: #f4f2ed; padding: 56px 78px;
          display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 27px; font-weight: 800; color: #c8102e;
            letter-spacing: 1.6px; margin-bottom: 26px; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -3px;
       font-weight: 800; margin-bottom: 34px; }
  p { font-size: 37px; line-height: 1.36; color: #6b7280;
      max-width: 21ch; letter-spacing: -0.4px; }
</style>
</head>
<body>
  <div class="top">big12ology.com</div>
  <div class="rule"></div>
  <div class="body">
    <div class="kicker">BIG12OLOGY</div>
    <h1>Attendance Tracker</h1>
    <p>Percent of capacity for all sixteen Big 12 teams, every home game
       since 2012.</p>
  </div>
  <div class="rule"></div>
</body>
</html>
